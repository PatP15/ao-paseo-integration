                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Read one outbox command's delivery state
      tags:
      - execution
  /api/v1/execution/dispatch:
    post:
      operationId: dispatchExecution
      requestBody:
        content:
          application/json:
            schema:
