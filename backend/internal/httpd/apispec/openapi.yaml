components:
  schemas:
    APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
      - error
      - code
      - message
      type: object
    AddProjectInput:
      properties:
        asWorkspace:
          type: boolean
        config:
          $ref: '#/components/schemas/ProjectConfig'
        name:
          type:
          - "null"
          - string
        path:
          type: string
        projectId:
          type:
          - "null"
          - string
      required:
      - path
      type: object
    AgentConfig:
      properties:
        model:
          type: string
        permissions:
          type: string
      type: object
    AgentInfo:
      properties:
        authStatus:
          description: Advisory local auth probe result. authorized means a recent
            local probe passed; spawn remains the authoritative validation point.
          enum:
          - authorized
          - unauthorized
          - unknown
          type: string
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
      type: object
    AnswerExecutionQuestionRequest:
      properties:
        answer:
          type: string
        answeredBy:
          description: Recorded in the audit log. Defaults to "human".
          type: string
      required:
      - answer
      type: object
    ApproveWorkItemRequest:
      properties:
        approver:
          type: string
        decision:
          description: Approval decision; defaults to approved when omitted.
          enum:
          - approved
          - rejected
          type: string
      required:
      - approver
      type: object
    BrowserCommandRequest:
      properties:
        action:
          type: string
        args:
          additionalProperties: {}
          type: object
        sessionId:
          type: string
      required:
      - sessionId
      - action
      type: object
    BrowserCommandResponse:
      properties:
        action:
          type: string
        requestId:
          type: string
        result: {}
        sessionId:
          type: string
      required:
      - requestId
      - sessionId
      - action
      - result
      type: object
    BrowserStatusResponse:
      properties:
        connected:
          type: boolean
        connectedAt:
          format: date-time
          type: string
        sessionId:
          type: string
        transport:
          type: string
      required:
      - sessionId
      - connected
      - transport
      type: object
    CancelReviewResponse:
      properties:
        reviewerHandleId:
          type: string
        reviews:
          items:
            $ref: '#/components/schemas/PRReviewState'
          type: array
      required:
      - reviewerHandleId
      - reviews
      type: object
    ClaimPRRequest:
      properties:
        allowTakeover:
          type:
          - "null"
          - boolean
        pr:
          minLength: 1
          type: string
      required:
      - pr
      type: object
    ClaimPRResponse:
      properties:
        branchChanged:
          type: boolean
        ok:
          type: boolean
        prs:
          items:
            $ref: '#/components/schemas/SessionPRFacts'
          type: array
        sessionId:
          type: string
        takenOverFrom:
          items:
            type: string
          type: array
      required:
      - ok
      - sessionId
      - prs
      - branchChanged
      - takenOverFrom
      type: object
    CleanupSessionsResponse:
      properties:
        cleaned:
          items:
            type: string
          type: array
        ok:
          type: boolean
        skipped:
          items:
            $ref: '#/components/schemas/CleanupSkippedSession'
          type: array
      required:
      - ok
      - cleaned
      - skipped
      type: object
    CleanupSkippedSession:
      properties:
        reason:
          type: string
        sessionId:
          type: string
      required:
      - sessionId
      - reason
      type: object
    ContainerReapConfig:
      properties:
        disabled:
          type: boolean
      type: object
    ControllersBindProjectRequest:
      properties:
        baseBranch:
          type: string
        disabled:
          type: boolean
        hostRepoPath:
          type: string
        priority:
          type: integer
        setupProfile:
          type: string
      required:
      - hostRepoPath
      type: object
    ControllersBindProjectResponse:
      properties:
        baseBranch:
          type: string
        enabled:
          type: boolean
        hostId:
          type: string
        hostRepoPath:
          type: string
        priority:
          type: integer
        projectId:
          type: string
      required:
      - projectId
      - hostId
      - hostRepoPath
      - baseBranch
      - priority
      - enabled
      type: object
    ControllersCreateExecutionSecretRequest:
      properties:
        name:
          description: 'Bare file name the ref will use: no path separators, whitespace,
            or leading dot.'
          type: string
        replace:
          description: Must be true to rotate an existing ref; otherwise an existing
            name is refused.
          type: boolean
        value:
          description: The credential. Stored 0600 under the daemon's data dir; never
            returned, logged, or persisted anywhere else.
          type: string
      required:
      - name
      - value
      type: object
    ControllersDispatchSettings:
      properties:
        features:
          additionalProperties:
            type: boolean
          description: Provider feature toggles. Not supported by the pinned Paseo
            CLI; any entry is refused.
          type: object
        thinkingOptionId:
          description: Thinking option id from the host's provider discovery; requires
            model to be set.
          type: string
      type: object
    ControllersExecutionBindingResponse:
      properties:
        baseBranch:
          type: string
        createdAt:
          format: date-time
          type: string
        enabled:
          type: boolean
        hostId:
          type: string
        hostRepoPath:
          description: Checkout path on the host, which AO cannot infer.
          type: string
        priority:
          description: Lower sorts first when several hosts qualify.
          type: integer
        projectId:
          type: string
        setupProfile:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - projectId
      - hostId
      - hostRepoPath
      - baseBranch
      - priority
      - enabled
      - createdAt
      - updatedAt
      type: object
    ControllersExecutionCommandResponse:
      properties:
        acknowledgedAt:
          format: date-time
          type: string
        attemptCount:
          description: Delivery attempts so far, including escalations.
          type: integer
        commandId:
          type: string
        commandState:
          enum:
          - pending
          - delivering
          - acknowledged
          - failed
          type: string
        commandType:
          enum:
          - start_agent
          - send_message
          - answer_permission
          - deny_permission
          type: string
        createdAt:
          format: date-time
          type: string
        hostId:
          type: string
        lastError:
          description: Most recent delivery failure, cleared by success.
          type: string
        nextAttemptAt:
          format: date-time
          type: string
        sessionId:
          type: string
      required:
      - commandId
      - sessionId
      - hostId
      - commandType
      - commandState
      - attemptCount
      - createdAt
      - nextAttemptAt
      - acknowledgedAt
      type: object
    ControllersExecutionEventResponse:
      properties:
        applied:
          description: Whether AO has applied this event to its own state.
          type: boolean
        hostId:
          type: string
        id:
          type: string
        ingestedAt:
          format: date-time
          type: string
        kind:
          description: Event type as ingested, e.g. checkpoint, status_transition.
          type: string
        launchId:
          type: string
        observedAt:
          format: date-time
          type: string
        payloadJson:
          type: string
        sessionId:
          type: string
        transport:
          enum:
          - terminal
          - sentinel
          - inspect
          - output_schema
          type: string
      required:
      - id
      - sessionId
      - hostId
      - kind
      - transport
      - payloadJson
      - observedAt
      - ingestedAt
      - applied
      type: object
    ControllersExecutionHostInventoryResponse:
      properties:
        prefs:
          $ref: '#/components/schemas/ControllersExecutionHostPrefsResponse'
        refreshed:
          description: True when this response came from a live channel run rather
            than cache alone.
          type: boolean
        skills:
          items:
            $ref: '#/components/schemas/ControllersExecutionHostSkillResponse'
          type: array
        skillsAsOf:
          format: date-time
          type: string
      required:
      - skills
      - skillsAsOf
      - refreshed
      type: object
    ControllersExecutionHostPrefsResponse:
      properties:
        confirmedAt:
          format: date-time
          type: string
        content:
          type: string
        exists:
          description: False when the file is absent on the host; content is then
            empty and sha256 is the empty-string hash.
          type: boolean
        sha256:
          type: string
      required:
      - content
      - sha256
      - exists
      - confirmedAt
      type: object
    ControllersExecutionHostSkillResponse:
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    ControllersExecutionPreferencesEnvelope:
      properties:
        prefs:
          $ref: '#/components/schemas/ControllersExecutionHostPrefsResponse'
      required:
      - prefs
      type: object
    ControllersExecutionProviderModelResponse:
      properties:
        defaultThinkingOptionId:
          type: string
        description:
          type: string
        id:
          type: string
        label:
          type: string
        thinkingOptionIds:
          items:
            type: string
          type: array
      required:
      - id
      - label
      - thinkingOptionIds
      type: object
    ControllersExecutionProviderResponse:
      properties:
        defaultMode:
          type: string
        enabled:
          type: boolean
        label:
          type: string
        modeLabels:
          items:
            type: string
          type: array
        models:
          description: Populated for available providers only.
          items:
            $ref: '#/components/schemas/ControllersExecutionProviderModelResponse'
          type: array
        provider:
          type: string
        status:
          description: Provider availability as the host daemon reports it, e.g. available
            or unavailable.
          type: string
      required:
      - provider
      - label
      - status
      - enabled
      - modeLabels
      - models
      type: object
    ControllersExecutionScheduleResponse:
      properties:
        cadence:
          type: string
        id:
          type: string
        lastRunAt:
          format: date-time
          type: string
        name:
          type: string
        nextRunAt:
          format: date-time
          type: string
        policyViolation:
          type: boolean
        status:
          type: string
        target:
          type: string
      required:
      - id
      - cadence
      - status
      - nextRunAt
      - lastRunAt
      - policyViolation
      type: object
    ControllersExecutionSecretEnvelope:
      properties:
        ref:
          description: The stored ref, as passed to endpointSecretRef at host registration.
          type: string
      required:
      - ref
      type: object
    ControllersListExecutionBindingsResponse:
      properties:
        bindings:
          items:
            $ref: '#/components/schemas/ControllersExecutionBindingResponse'
          type: array
      required:
      - bindings
      type: object
    ControllersListExecutionEventsResponse:
      properties:
        events:
          items:
            $ref: '#/components/schemas/ControllersExecutionEventResponse'
          type: array
        nextAfter:
          type: string
      required:
      - events
      type: object
    ControllersListExecutionProvidersResponse:
      properties:
        providers:
          items:
            $ref: '#/components/schemas/ControllersExecutionProviderResponse'
          type: array
      required:
      - providers
      type: object
    ControllersListExecutionSchedulesResponse:
      properties:
        schedules:
          items:
            $ref: '#/components/schemas/ControllersExecutionScheduleResponse'
          type: array
      required:
      - schedules
      type: object
    ControllersListExecutionSecretsResponse:
      properties:
        refs:
          items:
            type: string
          type: array
      required:
      - refs
      type: object
    ControllersPutExecutionPreferencesRequest:
      properties:
        baseSha256:
          description: Hex sha256 of the content currently on the host, from the inventory
            read. A mismatch on the host is refused as drift.
          type: string
        content:
          description: Complete new file content; must be valid JSON.
          type: string
      required:
      - content
      - baseSha256
      type: object
    ControllersSessionView:
      properties:
        activity:
          $ref: '#/components/schemas/DomainActivity'
        branch:
          type: string
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        executionAttempt:
          description: Provision attempt this session is bound to; bumps on ambiguous-create
            escalation.
          type: integer
        executionBackend:
          description: Execution substrate that owns the session's process, e.g. paseo.
            Absent for local sessions.
          type: string
        executionHostId:
          description: Registered host this session runs on. Absent for local sessions.
          type: string
        harness:
          type: string
        id:
          type: string
        isTerminated:
          type: boolean
        issueId:
          type: string
